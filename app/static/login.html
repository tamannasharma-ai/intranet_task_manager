<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Continuum - Sign in</title>
  <script src="/vendor/tailwindcdn.js"></script>
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="/vendor/continuum-theme.css?v=1" />
</head>
<body class="continuum-wallpaper min-h-screen text-slate-800 antialiased">
  <div class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <div class="bg-indigo-600 px-6 py-5 text-white">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center border border-white/20">
              <i class="fa-solid fa-clock-rotate-left"></i>
            </div>
            <div>
              <p class="text-xs uppercase tracking-[0.2em] text-indigo-100">Continuum</p>
              <h1 class="text-xl font-bold">Work Management</h1>
            </div>
          </div>
        </div>

        <div class="p-6 sm:p-8">
          <div class="mb-6">
            <p class="text-sm font-medium text-slate-500">Secure sign in</p>
            <h2 class="mt-1 text-2xl font-bold text-slate-900">Welcome back</h2>
          </div>

          <form id="loginForm" class="space-y-5">
            <div>
              <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">Email address</label>
              <input id="username" name="username" type="email" required placeholder="avery@example.com" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
            </div>

            <div>
              <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
              <input id="password" name="password" type="password" required placeholder="Enter password" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
            </div>

            <div id="loginError" class="hidden rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700"></div>

            <button type="submit" id="submitButton" class="w-full rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition">
              Sign in
            </button>
          </form>

          <div class="mt-6 rounded-xl border border-slate-200 bg-slate-50 p-4">
            <div class="flex items-center justify-between gap-3 mb-2">
              <p class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Select your account</p>
              <span id="userCount" class="text-xs text-slate-400"></span>
            </div>
            <p class="text-xs text-slate-500 mb-3">Fictional demo: choose any account and use password <strong>DemoPass123!</strong>. Changes are temporary and may reset between requests or restarts. Do not enter real employee data.</p>
            <div id="userList" class="max-h-64 overflow-y-auto space-y-2 text-sm text-slate-600">
              <p class="text-sm text-slate-400">Loading users...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const submitButton = document.getElementById('submitButton');

    function showError(message) {
      loginError.textContent = message;
      loginError.classList.remove('hidden');
    }

    function hideError() {
      loginError.classList.add('hidden');
      loginError.textContent = '';
    }

    function saveSession(token, user) {
      localStorage.setItem('taskManagerToken', token);
      localStorage.setItem('taskManagerUser', JSON.stringify(user));
    }

    function redirectToDashboard() {
      window.location.href = '/dashboard';
    }

    function selectUser(event) {
      const target = event.currentTarget;
      document.getElementById('username').value = target.dataset.email;
      document.querySelectorAll('.login-user').forEach(button => {
        button.classList.remove('border-indigo-500', 'bg-indigo-50');
        button.classList.add('border-slate-200', 'bg-white');
      });
      target.classList.remove('border-slate-200', 'bg-white');
      target.classList.add('border-indigo-500', 'bg-indigo-50');
      document.getElementById('password').focus();
      hideError();
    }

    async function loadUsers() {
      const userList = document.getElementById('userList');
      const userCount = document.getElementById('userCount');

      try {
        const response = await fetch('/api/auth/users');
        const users = await response.json();
        if (!response.ok) {
          throw new Error(users.detail || 'Unable to load users.');
        }

        userCount.textContent = `${users.length} account${users.length === 1 ? '' : 's'}`;
        userList.replaceChildren();
        const usersById = new Map(users.map(user => [user.id, user]));
        users.forEach(user => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'login-user w-full text-left rounded-lg border border-slate-200 bg-white px-3 py-2 hover:border-indigo-300 hover:bg-indigo-50 transition';
          button.dataset.email = user.email;

          const name = document.createElement('span');
          name.className = 'block font-medium text-slate-800';
          name.textContent = user.name;

          const details = document.createElement('span');
          details.className = 'block text-xs text-slate-500 mt-0.5';
          const manager = user.manager_id ? usersById.get(user.manager_id) : null;
          const reportsTo = manager
            ? `Reports to ${manager.name} (${manager.email})`
            : 'Top-level account';
          details.textContent = `${user.role} · ${user.email}`;

          const hierarchy = document.createElement('span');
          hierarchy.className = 'block text-xs text-slate-400 mt-0.5';
          hierarchy.textContent = reportsTo;

          button.append(name, details, hierarchy);
          button.addEventListener('click', selectUser);
          userList.appendChild(button);
        });
      } catch (error) {
        userList.replaceChildren();
        const message = document.createElement('p');
        message.className = 'text-sm text-rose-600';
        message.textContent = 'Enter your corporate email address and password to sign in.';
        userList.appendChild(message);
      }
    }

    loadUsers();

    loginForm.addEventListener('submit', async function (event) {
      event.preventDefault();
      hideError();
      submitButton.disabled = true;
      submitButton.textContent = 'Signing in...';

      const formData = new URLSearchParams();
      formData.append('username', document.getElementById('username').value.trim());
      formData.append('password', document.getElementById('password').value);

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || 'Login failed. Please try again.');
        }

        saveSession(data.access_token, data.user);
        redirectToDashboard();
      } catch (error) {
        showError(error.message || 'Unable to sign in.');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
