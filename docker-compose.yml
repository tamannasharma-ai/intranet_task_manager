services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a private PostgreSQL URL}
      SECRET_KEY: ${SECRET_KEY:?Set a long random secret}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the HTTPS public origin}
      SECURE_COOKIES: "true"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_FREE_TIER_CONFIRMED: ${GROQ_FREE_TIER_CONFIRMED:-false}
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
